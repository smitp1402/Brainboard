name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brainboard-mcp

    strategy:
      fail-fast: false
      matrix:
        node: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: brainboard-mcp/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Catches a broken entrypoint: no key is set, so the server must exit 1
      # with the configuration error rather than crash some other way.
      - name: Smoke-test the entrypoint
        run: |
          set +e
          output=$(node dist/index.js 2>&1)
          code=$?
          set -e
          echo "$output"
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
          echo "$output" | grep -q "BRAINBOARD_API_KEY" || { echo "missing config error"; exit 1; }
